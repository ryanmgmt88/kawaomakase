<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Us - Omakase Experience</title>
  <style>
    /* Japandi Style - Black & White Minimalist */
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fcfcfc;
      color: #222;
      line-height: 1.6;
      letter-spacing: 0.5px;
    }
    
    header {
      background-color: #222;
      color: #fff;
      padding: 80px 20px;
      text-align: center;
    }
    
    h1 {
      font-weight: 300;
      font-size: 2.4em;
      margin: 0;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    
    header p {
      font-weight: 300;
      margin-top: 15px;
      font-size: 1.1em;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    
    nav {
      border-bottom: 1px solid #eee;
    }
    
    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    nav ul li {
      padding: 20px 30px;
    }
    
    nav ul li a {
      color: #222;
      text-decoration: none;
      font-size: 0.9em;
      text-transform: uppercase;
      letter-spacing: 2px;
      position: relative;
      transition: color 0.3s;
    }
    
    nav ul li a:hover {
      color: #777;
    }
    
    nav ul li a:after {
      content: '';
      position: absolute;
      width: 0;
      height: 1px;
      bottom: -5px;
      left: 0;
      background-color: #222;
      transition: width 0.3s;
    }
    
    nav ul li a:hover:after {
      width: 100%;
    }
    
    .container {
      padding: 80px 20px;
      max-width: 800px;
      margin: auto;
      text-align: center;
    }
    
    h2 {
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 40px;
      position: relative;
      display: inline-block;
    }
    
    h2:after {
      content: '';
      position: absolute;
      width: 40px;
      height: 1px;
      background-color: #222;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
    }
    
    .location-info {
      margin-bottom: 60px;
    }
    
    .location-info p {
      margin: 10px 0;
      font-size: 1.1em;
    }
    
    .map {
      margin: 40px 0;
      padding: 0 20px;
    }
    
    iframe {
      width: 100%;
      height: 400px;
      border: none;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    
    footer {
      background: #222;
      color: white;
      padding: 40px 20px;
      text-align: center;
      font-size: 0.9em;
      letter-spacing: 1px;
    }
    
    @media (max-width: 768px) {
      nav ul li {
        padding: 15px 20px;
      }
      
      h1 {
        font-size: 2em;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Find Us</h1>
    <p>Visit our restaurant and indulge in an unforgettable dining experience</p>
  </header>
  
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="findus.html">Find Us</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
  
  <div class="container">
    <h2>Our Location</h2>
    
    <div class="location-info">
      <p>37 E 1st St, New York, NY 10003</p>
      <p>Open Daily: 5:00 PM - 11:00 PM</p>
      <p>Phone: +1 212-123-4567</p>
    </div>
    
    <div class="map">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3023.8980940056506!2d-73.98968092392631!3d40.72408687138086!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c2599c0f2dd877%3A0x30a19c44e0dc6d8e!2s37%20E%201st%20St%2C%20New%20York%2C%20NY%2010003!5e0!3m2!1sen!2sus!4v1708995551234!5m2!1sen!2sus" allowfullscreen="" loading="lazy"></iframe>
    </div>
  </div>
  
  <footer>
    <p>&copy; 2025 Omakase Experience. All rights reserved.</p>
  </footer>
</body>
</html>
