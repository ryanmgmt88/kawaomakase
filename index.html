<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Head content remains the same -->
    <!-- ... -->
</head>
<body>
    <!-- Full-screen background image -->
    <div class="background"></div>
    
    <!-- Centered navigation -->
    <div class="navigation">
        <div class="logo">KAWA OMAKASE</div>
        <ul class="menu">
            <li><a href="#" id="menu-link">MENU</a></li>
            <!-- Modified reservation link -->
            <li><a href="https://resy.com/cities/new-york-ny/venues/kawa-omakase" class="reserve-link" id="reserve-link" target="_blank" rel="noopener noreferrer">RESERVE</a></li>
            <li><a href="#" id="info-link">INFO</a></li>
        </ul>
    </div>

    <!-- Menu and Info sections remain the same -->
    <!-- ... -->

    <script>
        // Menu popup functionality
        document.getElementById('menu-link').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('menu-container').style.display = 'block';
        });
        
        document.getElementById('close-menu').addEventListener('click', function() {
            document.getElementById('menu-container').style.display = 'none';
        });
        
        // Info popup functionality
        document.getElementById('info-link').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('info-container').style.display = 'block';
        });
        
        document.getElementById('close-info').addEventListener('click', function() {
            document.getElementById('info-container').style.display = 'none';
        });
        
        // Remove the onclick attribute and use this more robust approach for the reservation link
        document.getElementById('reserve-link').addEventListener('click', function(e) {
            // Don't prevent default - let the browser handle the link normally
            // The target="_blank" attribute will open in a new tab/window
        });
        
        // Make sure touchend works properly on mobile Safari
        document.getElementById('reserve-link').addEventListener('touchend', function(e) {
            // Don't prevent default behavior
            // This will allow the href to work naturally
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.getElementById('menu-container').style.display = 'none';
                document.getElementById('info-container').style.display = 'none';
            }
        });
    </script>
</body>
</html>
